<style>

x:'<svg viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>',
music:'<svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
musicoff:'<svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/><path d="M3 3l18 18"/></svg>',

/* ---------- утилиты ---------- */
const $=id=>document.getElementById(id);
const cp=x=>JSON.parse(JSON.stringify(x));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dkey(d)};
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pl=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?f[2]:b>1&&b<5?f[1]:b===1?f[0]:f[2]};
function hashPin(p){let h=2166136261;const s='grumi|'+p;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}

/* ---------- данные ---------- */
const DEFAULT={ver:VER,profile:{name:'',age:'',className:'',interests:'',goal:''},onboarded:false,music:true,splash:true,pinH:hashPin('1111'),pinLen:4,pinDefault:true,verificationRequired:true,stars:0,totalEarned:0,dailyLimit:4,situation:'',tasks:[],history:[],stats:{byCat:{},independent:0},streak:0,bestStreak:0,lastActive:'',day:'',unseen:{n:0,stars:0,ach:[]},ach:null};
function normalize(x){
 const d=Object.assign(cp(DEFAULT),x||{});
 d.profile=Object.assign(cp(DEFAULT.profile),d.profile||{});
 d.stats=Object.assign({byCat:{},independent:0},d.stats||{});d.stats.byCat=d.stats.byCat||{};d.stats.independent=+d.stats.independent||0;
 d.unseen=Object.assign({n:0,stars:0,ach:[]},d.unseen||{});if(!Array.isArray(d.unseen.ach))d.unseen.ach=[];
 if(d.parentPin){d.pinH=hashPin(d.parentPin);d.pinLen=String(d.parentPin).length;d.pinDefault=String(d.parentPin)==='1111';delete d.parentPin}
 d.pinLen=Math.min(6,Math.max(4,+d.pinLen||4));
 d.totalEarned=+d.totalEarned||0;d.stars=+d.stars||0;d.dailyLimit=Math.min(8,Math.max(1,+d.dailyLimit||4));
 d.streak=+d.streak||0;d.bestStreak=Math.max(+d.bestStreak||0,d.streak);
 d.history=(Array.isArray(d.history)?d.history:[]).slice(-500).map(h=>({title:String(h.title||''),cat:CATS.includes(h.cat)?h.cat:'Другое',stars:+h.stars||0,independent:!!h.independent,at:h.at||new Date().toISOString()}));
 const seen=new Set();
 d.tasks=(Array.isArray(d.tasks)?d.tasks:[]).map(t=>{
  let id=String(t.id||'').replace(/[^\w-]/g,'');if(!id||seen.has(id))id=uid();seen.add(id);
  const steps=Array.isArray(t.steps)?t.steps.map(String).filter(Boolean):(/\n/.test(t.desc||'')?String(t.desc).split('\n').map(s=>s.trim()).filter(Boolean):[]);
  const desc=Array.isArray(t.steps)||!/\n/.test(t.desc||'')?String(t.desc||''):'';
  return{id,title:String(t.title||'Задание'),cat:CATS.includes(t.cat)?t.cat:'Другое',desc,steps,checked:Array.isArray(t.checked)?t.checked.filter(i=>Number.isInteger(i)&&i<steps.length):[],stars:+t.stars||20,done:!!t.done,pending:!!t.pending&&!t.done,independent:!!t.independent,due:t.due||'',repeat:t.repeat==='daily'?'daily':'',doneAt:t.doneAt||(t.done?(d.day||today()):'')}});
 if(!Array.isArray(d.ach))d.ach=null;
 return d}
function seedTasks(){const t=today();return[
 {id:uid(),title:'Моя комната',cat:'Дом',desc:'Небольшая уборка',steps:['Убрать вещи на место','Навести порядок на столе','Вынести мусор'],stars:20},
 {id:uid(),title:'Чтение',cat:'Чтение',desc:'15 минут',steps:[],stars:15},
 {id:uid(),title:'Математика',cat:'Учёба',desc:'Домашнее задание',steps:[],stars:30}
 ].map(k=>Object.assign({checked:[],done:false,pending:false,independent:false,due:t,repeat:'',doneAt:''},k))}
function load(){let raw=null;try{raw=localStorage.getItem(KEY)||localStorage.getItem(OLDKEY)}catch(e){}
 let x=null;try{x=raw&&JSON.parse(raw)}catch(e){}
 const d=normalize(x);if(!x)d.tasks=seedTasks();return d}
function save(){try{const now=Date.now(),last=+localStorage.getItem(BACKT)||0,prev=localStorage.getItem(KEY);
 if(prev&&now-last>1800000){localStorage.setItem(BACK,prev);localStorage.setItem(BACKT,String(now))}
 localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
let data=load();
const ui={tab:{tasks:'today',grumi:'dev',parent:'today'},taskId:null,plan:[],parentUntil:0,fails:0,lockUntil:0,after:null,screen:'home'};

function achN(a){const k=a[4];return k==='all'?data.history.length:k==='stars'?data.totalEarned:k==='ind'?data.stats.independent:k==='days'?data.bestStreak:(data.stats.byCat[k]||0)}
function rollDay(){const t=today();if(data.day===t)return;
 data.tasks=data.tasks.filter(k=>{if(k.done&&k.doneAt!==t){if(k.repeat){k.done=false;k.pending=false;k.checked=[];k.doneAt='';k.due=t;return true}return false}return true});
 data.tasks.forEach(k=>{if(!k.done&&!k.pending&&k.due&&k.due<t)k.due=t});
 data.day=t;
 if(data.ach===null)data.ach=ACH.filter(a=>achN(a)>=a[3]).map(a=>a[5]);
 save()}
rollDay();

function stage(){let i=0;WORLDS.forEach((w,k)=>{if(data.totalEarned>=w[0])i=k});const cur=WORLDS[i],nx=WORLDS[i+1];
 return{i,cur,nx,pct:nx?Math.max(4,Math.round((data.totalEarned-cur[0])/(nx[0]-cur[0])*100)):100}}
function streakNow(){return data.lastActive===today()||data.lastActive===addDays(-1)?data.streak:0}
function todayList(){const t=today();const all=data.tasks.filter(k=>k.repeat||!k.due||k.due<=t);
 const done=all.filter(k=>k.done),pend=all.filter(k=>k.pending&&!k.done),open=all.filter(k=>!k.done&&!k.pending);
 const room=Math.max(0,data.dailyLimit-done.length-pend.length);
 return{all,open:open.slice(0,room),queue:open.slice(room),pend,done,total:done.length+pend.length+Math.min(open.length,room)}}

/* ---------- родительская сессия ---------- */
const parentOK=()=>Date.now()<ui.parentUntil;
const touch=()=>{ui.parentUntil=Date.now()+300000};
function needParent(fn){if(parentOK()){touch();fn()}else parentLogin(fn)}
function lockParent(){ui.parentUntil=0;go('home');toast('Родительский режим закрыт')}
setInterval(()=>{if(ui.screen==='parent'&&!parentOK()){go('home');toast('Родительский режим закрыт')}},10000);

/* ---------- мелочи интерфейса ---------- */
let tt;
function toast(m,act,ms){const e=$('toast');e.innerHTML='';const s=document.createElement('span');s.textContent=m;e.appendChild(s);
 if(act){const b=document.createElement('button');b.textContent=act.label;b.onclick=()=>{e.classList.remove('show');act.fn()};e.appendChild(b)}
 e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),ms||(act?7000:2400))}
function undoToast(before,msg){toast(msg,{label:'Отменить',fn:()=>{data=before;save();render();toast('Отменено')}},7000)}
function modal(h){$('toast').classList.remove('show');$('sheet').innerHTML=h;$('modal').classList.add('open');$('sheet').scrollTop=0}
function closeModal(){$('modal').classList.remove('open')}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function pick(el){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))}
function setTab(scr,v){ui.tab[scr]=v;render()}
function tabs(scr,list,dark){return`<div class="tabs ${dark?'dark':''}" role="tablist">${list.map(([v,l])=>`<button role="tab" class="${ui.tab[scr]===v?'on':''}" onclick="setTab('${scr}','${v}')">${l}</button>`).join('')}</div>`}
function levelCard(st,icon){
 const nxt=st.nx?`ещё ${st.nx[0]-data.totalEarned} ✦ до «${esc(st.nx[1])}»`:'Все миры открыты';
 return`<div class="level" id="lvl"><div class="medal">${icon||'✦'}</div><div class="lv"><div class="r"><b>Уровень ${st.i+1}</b><span>${data.totalEarned}${st.nx?' / '+st.nx[0]:''} Luma</span></div><span class="bar"><i style="width:${st.pct}%"></i></span><div class="r s"><span class="ell">${nxt}</span></div></div></div>`}
function row(k,click){const st=k.done?'done':k.pending?'pend':'';
 const sub=esc(k.desc||'Небольшой шаг')+(k.steps.length&&!k.done&&!k.pending?` · ${k.checked.length}/${k.steps.length} шагов`:k.pending?' · ждёт проверки':'');
 return`<button class="item ${k.done?'done':''}" onclick="${click}"><span class="ico" style="background:${CC[k.cat]}">${CI[k.cat]}</span><span class="grow"><span class="t1">${esc(k.title)}</span><span class="t2">${sub}</span></span><span class="chip">+${k.stars} ✦</span><span class="state ${st}">${k.done?'✓':k.pending?'⏳':''}</span></button>`}

/* ---------- экраны ребёнка ---------- */
function render(){home();tasksScreen();worldScreen();grumiScreen();if(ui.screen==='parent'&&parentOK())parentScreen();if(ui.screen==='task')taskScreen()}
function home(){const L=todayList(),st=stage(),n=L.open.length,u=data.unseen;
 const sub=n?`Груми зовёт: сегодня ${n} ${pl(n,['дело','дела','дел'])}`:(L.pend.length?'Ждём, пока родитель проверит':'На сегодня всё — можно отдыхать');
 const pend=data.tasks.some(t=>t.pending);
 let list=L.open.map(k=>row(k,`openTask('${k.id}')`)).join('')+L.pend.map(k=>row(k,`openTask('${k.id}')`)).join('')+L.done.map(k=>row(k,`openTask('${k.id}')`)).join('');
 let msg='';
 if(!L.total&&!L.queue.length)msg=`<div class="empty"><div class="big">🌱</div><b>Пока нет дел</b><p>Расскажи Груми, что происходит, — он предложит первые шаги.</p></div>`;
 else if(!L.open.length)msg=`<div class="empty"><div class="big">🌙</div><b>На сегодня достаточно</b><p>Груми предлагает отдохнуть и вернуться к настоящей жизни.</p></div>`;
 const ach=u.ach.map(id=>(ACH.find(a=>a[5]===id)||[''])[0]).join(' ');
 const cheer=u.n?`<div class="cheer"><span class="medal sm">✦</span><span class="grow"><span class="t1">+${u.stars} ✦ Luma — молодец!</span><span class="t2">Родитель подтвердил ${u.n} ${pl(u.n,['дело','дела','дел'])}${ach?' · новое достижение '+ach:''}</span></span><button class="btn sm" onclick="collect()">Ура!</button></div>`:'';
 $('home').innerHTML=`<div class="scene"><img src="${AS.hero}" alt="" style="object-position:8% 35%"><div class="top"><div><div class="hi">Привет, ${esc(data.profile.name||'друг')}! 🌸</div><div class="sub">${sub}</div></div><div class="tools"><button class="iconbtn ${data.music?'on':''}" aria-label="Фоновая музыка" aria-pressed="${!!data.music}" onclick="toggleMusic()">${data.music?I.music:I.musicoff}</button><button class="iconbtn" aria-label="Для родителей" onclick="go('parent')">${I.lock}${pend?'<span class="dot"></span>':''}</button></div></div>${levelCard(st)}</div>
 <div class="body">${cheer}<div class="h"><h2>Сегодня</h2><button onclick="go('tasks')">Все задания ›</button></div>${list}${msg}
 <button class="item" onclick="askGrumi()"><span class="ico">💬</span><span class="grow"><span class="t1">Что сегодня происходит?</span><span class="t2">Расскажи Груми — он предложит шаги</span></span><span style="color:#b3a9c0;font-size:22px">›</span></button></div>`}
function collect(){chime();data.unseen={n:0,stars:0,ach:[]};save();render();const e=$('lvl');if(e){e.classList.add('pulse');setTimeout(()=>e.classList.remove('pulse'),900)}}
function tasksScreen(){const L=todayList(),t=today();const v=ui.tab.tasks;let c='';
 if(v==='today'){c=[...L.open,...L.pend,...L.done].map(k=>row(k,`openTask('${k.id}')`)).join('')||'<div class="empty"><div class="big">🌱</div><b>Пока нет дел</b></div>';
  if(L.queue.length)c+=`<div class="h"><h2>На потом</h2><span class="t2">лимит дня</span></div>`+L.queue.map(k=>row(k,`toast('Это дело — на потом. Сегодня уже достаточно.')`).replace('class="item','class="item later')).join('')}
 else if(v==='later'){const f=data.tasks.filter(k=>!k.repeat&&k.due>t);c=f.map(k=>row(k,`toast('Это дело начнётся завтра')`).replace('class="item','class="item later')).join('')||'<div class="empty"><div class="big">🗓</div><b>Дальше пока пусто</b></div>'}
 else{const h=data.history.slice().reverse().slice(0,40);c=h.map(x=>{const d=new Date(x.at);return`<div class="item"><span class="ico" style="background:${CC[x.cat]}">${CI[x.cat]}</span><span class="grow"><span class="t1">${esc(x.title)}</span><span class="t2">${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</span></span><span class="chip">+${x.stars} ✦</span></div>`}).join('')||'<div class="empty"><div class="big">✨</div><b>Здесь появятся твои достижения</b></div>'}
 $('tasks').innerHTML=`<div class="page"><h1>Задания</h1>${tabs('tasks',[['today','Сегодня'],['later','Дальше'],['hist','История']])}${c}</div>`}
function openTask(id){if(!data.tasks.find(x=>x.id===id))return;ui.taskId=id;go('task')}
function taskScreen(){const t=data.tasks.find(x=>x.id===ui.taskId);if(!t){go('home');return}
 const all=!t.steps.length||t.checked.length===t.steps.length;
 const steps=t.steps.length?`<div class="h"><h2>Что нужно сделать</h2><span class="t2">${t.checked.length} из ${t.steps.length}</span></div>`+t.steps.map((s,i)=>`<button class="step ${t.checked.includes(i)?'on':''}" ${t.done||t.pending?'disabled':''} onclick="toggleStep(${i})"><span class="box">${t.checked.includes(i)?'✓':''}</span><span class="tx">${esc(s)}</span></button>`).join(''):'';
 const foot=t.done?'<div class="note ok">Дело сделано и подтверждено ✓</div>':t.pending?'<div class="note">Родитель скоро проверит ⏳</div>':`<div class="cta"><button class="btn" ${all?'':'disabled'} onclick="finish('${t.id}')">${all?'Готово! ✦':'Отметь все шаги'}</button></div>`;
 $('task').innerHTML=`<div class="scene short"><img src="${AS.grumi}" alt="" style="object-position:50% 28%"><div class="top"><button class="iconbtn" aria-label="Назад" onclick="back()">${I.back}</button></div></div>
 <div class="body"><h1 class="tt">${esc(t.title)} ✨</h1><p class="lead">${esc(t.desc||'Небольшая миссия для большого результата!')}</p>${steps}
 <div class="item" style="margin-top:6px;min-height:60px"><span class="grow"><span class="t1">Награда</span></span><span class="chip big">+${t.stars} ✦ Luma</span></div>${foot}</div>`}
function toggleStep(i){const t=data.tasks.find(x=>x.id===ui.taskId);if(!t||t.done||t.pending)return;const k=t.checked.indexOf(i);if(k>=0)t.checked.splice(k,1);else t.checked.push(i);save();taskScreen()}
function finish(id){const t=data.tasks.find(x=>x.id===id);if(!t||t.done||t.pending)return;if(t.steps.length&&t.checked.length<t.steps.length)return;
 chime();if(data.verificationRequired){t.pending=true;save();go('home');toast('Отправлено родителю 💗')}
 else{applyApprove(t);const g=newAch();g.forEach(a=>data.unseen.ach.push(a[5]));save();go('home');toast('Готово! Звёзды добавлены ✨')}}
function worldScreen(){const st=stage();
 $('world').innerHTML=`<div class="scene tall"><img src="${AS.world}" alt="" style="object-position:100% 50%"><div class="top"><div><div class="hi">Мой мир</div><div class="sub">${st.cur[2]} ${esc(st.cur[1])}</div></div></div>${levelCard(st,st.cur[2])}</div>
 <div class="body"><div class="h"><h2>Путь Груми</h2></div>${WORLDS.map((w,i)=>{const on=data.totalEarned>=w[0];return`<div class="node ${on?'':'lock'} ${i===st.i?'now':''}"><span class="ico">${w[2]}</span><span class="grow"><span class="t1">${w[1]}</span><span class="t2">${w[0]} ✦ Luma</span></span><span class="s">${on?(i===st.i?'Ты здесь':'✓'):'🔒'}</span></div>`}).join('')}</div>`}
function grumiScreen(){const v=ui.tab.grumi;let c='';
 if(v==='dev'){c=`<div class="grid3"><div class="stat"><b>${data.totalEarned}</b><span>Luma</span></div><div class="stat"><b>${streakNow()}</b><span>${pl(streakNow(),['день','дня','дней'])} подряд</span></div><div class="stat"><b>${data.stats.independent}</b><span>своих идей</span></div></div><div class="h"><h2>Навыки</h2></div>`+
  SKILLS.map(([n,ic,cs])=>{const k=cs.reduce((s,x)=>s+(data.stats.byCat[x]||0),0),lv=1+Math.floor(k/3),p=(k%3)/3*100;return`<div class="item"><span class="ico">${ic}</span><span class="grow"><span class="t1">${n}</span><span class="bar light"><i style="width:${Math.max(6,p)}%"></i></span></span><span class="chip" style="background:#efe8ff;color:#5f3fc4">Ур. ${lv}</span></div>`}).join('')}
 else if(v==='ach'){c=`<div class="meds">${ACH.map(a=>`<div class="med ${achN(a)>=a[3]?'':'lock'}" title="${esc(a[1])}">${a[0]}</div>`).join('')}</div>`+ACH.map(a=>{const n=achN(a),ok=n>=a[3];return`<div class="item" style="${ok?'':'opacity:.6'}"><span class="ico" style="background:#fff0c9">${a[0]}</span><span class="grow"><span class="t1">${a[1]}</span><span class="t2">${a[2]} · ${Math.min(n,a[3])}/${a[3]}</span></span>${ok?'<span class="state done">✓</span>':''}</div>`}).join('')}
 else{const p=data.profile;c=`<div class="field"><label for="pname">Имя</label><input id="pname" class="in" value="${esc(p.name)}"></div><div class="row"><div class="field"><label for="page">Возраст</label><input id="page" class="in" type="number" inputmode="numeric" value="${esc(p.age)}"></div><div class="field"><label for="pclass">Класс</label><input id="pclass" class="in" value="${esc(p.className)}"></div></div><div class="field"><label for="pint">Интересы</label><input id="pint" class="in" value="${esc(p.interests)}"></div><div class="field"><label for="pgoal">Цель</label><textarea id="pgoal" class="in">${esc(p.goal)}</textarea></div><button class="btn" onclick="saveProfile()">Сохранить</button><button class="btn ghost" style="margin-top:10px" onclick="showOnb('help')">Как это работает</button><div class="h" style="margin-top:22px"><h2>Варианты Груми</h2></div><img class="vimg" src="${AS.variants}" alt="Варианты Груми">`}
 $('grumi').innerHTML=`<div class="scene short"><img src="${AS.grumi}" alt="" style="object-position:50% 25%"><div class="top"><div><div class="hi">Мой Груми</div><div class="sub">Маленький хранитель звёздной энергии 💗</div></div></div></div><div class="body">${tabs('grumi',[['dev','Развитие'],['ach','Достижения'],['prof','Профиль']])}${c}</div>`}
function saveProfile(){const p=data.profile;p.name=$('pname').value.trim();p.age=$('page').value.trim();p.className=$('pclass').value.trim();p.interests=$('pint').value.trim();p.goal=$('pgoal').value.trim();save();render();toast('Сохранено')}

/* ---------- подсказки Груми ---------- */
function askGrumi(){modal(`<h2>Что сегодня происходит?</h2><p class="lead">Расскажи своими словами — Груми подберёт до трёх небольших шагов.</p><div class="field"><textarea id="situation" class="in" placeholder="Например: завтра контрольная, в комнате беспорядок…">${esc(data.situation||'')}</textarea></div><button class="btn" onclick="planSituation()">Подсказать шаги</button>`);setTimeout(()=>$('situation')&&$('situation').focus(),80)}
function planSituation(){const s=($('situation')?.value||'').trim();data.situation=s;save();const q=s.toLowerCase();
 let a=RULES.filter(r=>r[0].test(q)).map(r=>r[1]).slice(0,3);

/* ---------- музыка Груми (генерируется в браузере, без файлов) ---------- */
const Snd={ctx:null,on:false,timer:null,next:0,beat:0,last:3};
const CHORDS=[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,64]];
const SCALE=[67,69,72,74,76,79,81,84];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function sndInit(){if(Snd.ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
 const c=Snd.ctx=new AC();Snd.master=c.createGain();Snd.master.gain.value=0;Snd.master.connect(c.destination);
 const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2800;lp.connect(Snd.master);
 const d=c.createDelay(2);d.delayTime.value=.45;const fb=c.createGain();fb.gain.value=.36;const dl=c.createBiquadFilter();dl.type='lowpass';dl.frequency.value=1700;
 d.connect(dl);dl.connect(fb);fb.connect(d);const wet=c.createGain();wet.gain.value=.5;dl.connect(wet);wet.connect(lp);
 Snd.dry=lp;Snd.echo=d;return true}
function tone(f,t,dur,vol,type,att,echo){const c=Snd.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);let out=g;if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=Math.random()*1.2-.6;g.connect(p);out=p}
 out.connect(Snd.dry);if(echo){const e=c.createGain();e.gain.value=echo;out.connect(e);e.connect(Snd.echo)}
 o.start(t);o.stop(t+dur+.1)}
function bell(f,t,v){v=v||1;tone(f,t,2.6,.07*v,'sine',.012,.7);tone(f*2,t,1.3,.02*v,'sine',.012,.5);tone(f*3.01,t,.5,.008*v,'sine',.01,.3)}
function sndTick(){const c=Snd.ctx;if(!Snd.on||!c)return;
 while(Snd.next<c.currentTime+1.4){
  if(Snd.beat%8===0)CHORDS[(Snd.beat/8)%4].forEach((m,i)=>{const t=Snd.next+i*.14;tone(mtof(m),t,9,.03,'triangle',2.4,.15);tone(mtof(m)*1.004,t,9,.016,'sine',2.8,.1)});
  if(Math.random()<.62){const st=[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)];Snd.last=Math.min(SCALE.length-1,Math.max(0,Snd.last+st));bell(mtof(SCALE[Snd.last]),Snd.next+Math.random()*.12)}
  Snd.next+=.9;Snd.beat++}}
function musicOn(){if(!sndInit())return;const c=Snd.ctx;if(c.state==='suspended')c.resume();Snd.on=true;Snd.next=c.currentTime+.15;Snd.beat=0;
 const g=Snd.master.gain;g.cancelScheduledValues(c.currentTime);g.setValueAtTime(g.value,c.currentTime);g.linearRampToValueAtTime(.85,c.currentTime+3);
 clearInterval(Snd.timer);Snd.timer=setInterval(sndTick,300);sndTick()}
function musicOff(){const c=Snd.ctx;if(!c)return;Snd.on=false;const g=Snd.master.gain;g.cancelScheduledValues(c.currentTime);g.setValueAtTime(g.value,c.currentTime);g.linearRampToValueAtTime(0,c.currentTime+.9);
 clearInterval(Snd.timer);setTimeout(()=>{if(!Snd.on&&c.state==='running')c.suspend()},1200)}
function toggleMusic(){data.music=!data.music;save();if(data.music)musicOn();else musicOff();render()}
function chime(){if(!data.music||!Snd.on||!Snd.ctx)return;const t=Snd.ctx.currentTime+.02;bell(mtof(88),t,1.3);bell(mtof(91),t+.16,1.3);bell(mtof(96),t+.34,1.1)}

 <div class="flow"><span>Дело</span><em>›</em><span>«Готово!»</span><em>›</em><span>Проверка родителя</span><em>›</em><span>+ Luma</span><em>›</em><span>Мир растёт</span></div>

 else if(s===1){c=`<h1 class="tt">Как зовут ребёнка?</h1><p class="lead">Груми будет обращаться по имени и подбирать дела под возраст.</p>

 L.push('Браузер: '+br);
 const ln=document.querySelector('link[rel=manifest]');ok('Ссылка на манифест в странице',!!ln,ln&&ln.getAttribute('href'));

 if(ln){try{const r=await fetch(ln.href,{cache:'no-store'});ok('Манифест скачивается',r.ok,r.status+' '+(r.headers.get('content-type')||''));mf=await r.json()}catch(e){ok('Манифест читается',false,String(e).slice(0,70))}}
 if(mf){ok('id уникальный',!!mf.id&&mf.id!=='./'&&mf.id!=='/',mf.id);L.push('  start_url: '+mf.start_url+' | scope: '+mf.scope+' | display: '+mf.display);
  for(const i of (mf.icons||[])){const u=new URL(i.src,ln.href).href;const sz=await new Promise(res=>{const im=new Image();im.onload=()=>res(im.naturalWidth+'×'+im.naturalHeight);im.onerror=()=>res('не открывается');im.src=u});ok('Иконка '+i.sizes+' '+(i.purpose||''),/^\d/.test(sz),sz)}}
 if('serviceWorker' in navigator){try{const rg=await navigator.serviceWorker.getRegistration();ok('Сервис-воркер зарегистрирован',!!rg,rg&&rg.scope);ok('Сервис-воркер активен',!!(rg&&rg.active),rg&&rg.active&&rg.active.state);ok('Страница под управлением воркера',!!navigator.serviceWorker.controller)}catch(e){ok('Сервис-воркер',false,String(e).slice(0,60))}}else ok('Сервис-воркеры поддерживаются',false);

async function checkUpdate(silent){
